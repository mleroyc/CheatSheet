site_name: CheatSheet
site_description: Aide-mémoire de cybersécurité offensive & défensive
site_author: Votre Nom

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top          # Bouton "back to top"
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy       # Bouton copier le code
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition               # !!! note, !!! warning, etc.
  - pymdownx.details
  - pymdownx.superfences     # Blocs de code avancés
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist:       # Checklists ☑
      custom_checkbox: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: fr
  - minify:
      minify_html: true

